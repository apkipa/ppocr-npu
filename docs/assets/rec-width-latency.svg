  .axis-label { fill: #293241; font: 14px Segoe UI, Arial, sans-serif; }
  .title { fill: #182230; font: 600 18px Segoe UI, Arial, sans-serif; }
  .band { fill: #75a7d9; fill-opacity: .23; stroke: none; }
  .line { fill: none; stroke: #1769aa; stroke-width: 2.5; }
  .mark { fill: #d45d3b; stroke: #fff; stroke-width: 1.5; }
  .label { fill: #293241; font: 12px Segoe UI, Arial, sans-serif; }
  .legend { fill: #596579; font: 12px Segoe UI, Arial, sans-serif; }
</style>
