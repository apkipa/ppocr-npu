<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
<title id="title">PP-OCRv6 Rec NPU latency by static input width</title>
<desc id="desc">P50 latency with P10 to P90 interval. Each width ran in an independent process with two seconds of wall-clock warmup and thirty measured requests.</desc>
